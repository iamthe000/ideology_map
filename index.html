<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>政治思想マップ</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #f8f9fa; font-family: 'Helvetica Neue', Arial, sans-serif; 
        }
        #map-container { 
            width: 100%; height: 100%; position: relative; touch-action: none; 
        }
        #map { 
            width: 1000px; height: 1000px; background-color: white; 
            position: absolute; transform-origin: 0 0; 
            border: 12px solid #000; box-sizing: border-box;
        }
        .axis-x { position: absolute; top: 50%; left: 0; width: 100%; height: 8px; background: #000; transform: translateY(-50%); }
        .axis-y { position: absolute; top: 0; left: 50%; width: 8px; height: 100%; background: #000; transform: translateX(-50%); }
        .axis-label { position: absolute; font-weight: 900; font-size: 36px; white-space: nowrap; color: #000; pointer-events: none; }
        .label-top { top: -60px; left: 50%; transform: translateX(-50%); }
        .label-bottom { bottom: -60px; left: 50%; transform: translateX(-50%); }
        .label-left { top: 50%; left: -60px; transform: translateY(-50%); writing-mode: vertical-rl; }
        .label-right { top: 50%; right: -60px; transform: translateY(-50%); writing-mode: vertical-rl; }
        .point { 
            position: absolute; width: 26px; height: 26px; background-color: red; 
            border-radius: 50%; transform: translate(-50%, -50%); 
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.4); z-index: 10; 
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .point:hover { transform: translate(-50%, -50%) scale(1.25); background-color: #d32f2f; }
        .point:active { transform: translate(-50%, -50%) scale(1.35); }
        .point-label { 
            position: absolute; font-weight: 900; font-size: 26px; 
            white-space: nowrap; color: #000; 
            background: rgb(255 255 255 / 20%);
            padding: 3px 8px; border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            pointer-events: auto; cursor: pointer; user-select: none;
            transition: color 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
            z-index: 11;
        }
        .point-label:hover {
            color: #d32f2f;
            background: rgba(255, 255, 255, 0.98);
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .point-label:active {
            transform: scale(0.98);
        }
        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); opacity: 0; visibility: hidden; 
            transition: 0.3s; z-index: 100; 
        }
        #modal { 
            position: fixed; bottom: -100%; left: 0; width: 100%; 
            background: #fff; border-radius: 24px 24px 0 0; padding: 25px; 
            box-sizing: border-box; transition: 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); 
            z-index: 101; max-height: 85vh; overflow-y: auto; 
            overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        }
        #modal.active { bottom: 0; }
        #modal-overlay.active { opacity: 1; visibility: visible; }
        #modal-title { font-size: 1.8em; margin: 0 0 10px 0; font-weight: 900; border-bottom: 3px solid #333; padding-bottom: 10px;}
        #modal-desc { 
            font-size: 1.05em; margin-bottom: 25px; line-height: 1.8; color: #333; 
            white-space: pre-wrap; word-break: break-word;
        }
        .link-btn { 
            display: block; width: 100%; padding: 16px; margin-bottom: 12px; 
            background: #007aff; color: white; text-align: center; 
            text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1em; box-sizing: border-box;
        }
        .link-btn:active { background: #0056b3; }
        .close-btn { 
            display: block; width: 100%; padding: 16px; background: #e9ecef; 
            color: #333; text-align: center; border-radius: 12px; font-weight: bold; 
            margin-top: 20px; cursor: pointer; box-sizing: border-box;
        }
        #zoom-controls { position: fixed; right: 20px; bottom: 30px; z-index: 50; display: flex; flex-direction: column; gap: 15px; }
        .zoom-btn { 
            width: 50px; height: 50px; background: white; border: none; border-radius: 50%; 
            font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; user-select: none; color: #333;
        }
        .zoom-btn:active { background: #e0e0e0; }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map">
            <div class="axis-x"></div>
            <div class="axis-y"></div>
            <div class="axis-label label-top">自由市場 規制緩和</div>
            <div class="axis-label label-bottom">国家介入 政府主導</div>
            <div class="axis-label label-left">政治的左翼（共産主義）</div>
            <div class="axis-label label-right">政治的右翼</div>
        </div>
    </div>

    <div id="zoom-controls">
        <div class="zoom-btn" onclick="zoomIn()">＋</div>
        <div class="zoom-btn" onclick="zoomOut()">－</div>
    </div>

    <div id="modal-overlay"></div>
    <div id="modal">
        <h2 id="modal-title"></h2>
        <div id="modal-desc"></div>
        <div id="modal-links"></div>
        <div class="close-btn" onclick="closeModal()">閉じる</div>
    </div>

    <script>
        const ideologies = [
            {
                id: 'neoliberalism', name: 'ネオリベラリズム', x: 67, y: 8,
                labelOffset: { x: 20, y: -20 },
                desc: '新自由主義とも呼ばれ、市場における自由な競争と自己責任原則を重視し、政府による規制や介入を最小限に抑制することを志向する政治・経済思想。国営企業の民営化や規制緩和、貿易の自由化を推進して「小さな政府」による成長を目指す。1970年代のスタグフレーションへの処方箋として急速に普及し、イギリスのサッチャー政権やアメリカのレーガン政権の政策基盤を形成した。代表的な論者にフリードリヒ・ハイエクやミルトン・フリードマンがいる。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/新自由主義' }]
            },
            {
                id: 'ordoliberalism', name: 'オルド自由主義', x: 56, y: 25,
                labelOffset: { x: 20, y: -20 },
                desc: '市場の公正な競争を守るために国家が適切な法的秩序を整えるべきという思想。二十世紀にドイツで誕生した。自由主義思想の一つである。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/新自由主義' }]
            },
            {
                id: 'libertarianism', name: 'リバタリアニズム', x: 50, y: 15,
                labelOffset: { x: -250, y: -20 },
                desc: '完全自由主義や自由至上主義と訳され、他者の基本的人権を侵害しない限り、個人の身体・思想・経済活動に対する国家の強制的制約を全面的に排除する立場をとる思想。自分自身の身体と財産に対する絶対的な自己所有権を根底に置き、ボランタリーな自由契約と取引を重んじる。課税や徴兵といった国家権力による強制に対して強い懸念を提示する。ジョン・ロックの権利論を源流とし、現代ではロバート・ノージックらにより体系化された。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/リバタリアニズム' }]
            },
            {
                id: 'freeism', name: '自由主義国家論', x: 50, y: 30,
                labelOffset: { x: -200, y: -20 },
                desc: '自由主義国家論とは、19世紀の近代市民社会において確立された政治思想および国家観であり、個人の権利や経済活動に対する国家の干渉を国防・治安維持・裁判などの最小限に抑制することを理想とする「消極的国家（夜警国家）」の構想を基軸に、私的所有権の絶対化、市場の自動調節作用への信頼、ならびに見えざる手を通じた資源配分の最適化を支持する一方で、20世紀以降は市場の失敗や社会的不平等の是正を目指すケインズ主義的「福祉国家（積極的国家）」の登場や、それに対する批判として市場原理主義を再構築した現代のネオリベラリズム（新自由主義）への昇華に至るまで、国家の介入範囲と個人の自由の調和をめぐり多角的に発展してきた理論体系である。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/自由主義国家論' }]
            },
            {
                id: 'minarchism', name: '最小国家主義', x: 72, y: 18,
                labelOffset: { x: 20, y: -20 },
                desc: '国家の役割を、個人の生命・自由・財産を守るための警察、司法、国防などに限定し、それ以外の経済・社会活動には原則として介入しないことを求める政治思想。自由市場と私有財産権を重視し、福祉や規制を含む政府機能の拡大に批判的な立場をとる。リバタリアニズムの一形態として論じられることが多い。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/ミナキズム' }]
            },
            {
                id: 'anarcho-capitalism', name: 'アナルコ・キャピタリズム', x: 80, y: 5,
                labelOffset: { x: 20, y: -20 },
                desc: '無政府資本主義と称され、国家概念そのものを完全に撤廃し、警察、司法、国防に至る社会的インフラを含めたすべてのサービスを私有財産権に基づく完全自由市場に委ねる思想。税金や法的独占の排除を主張し、個人間や民間事業者間の任意契約による法執行と紛争解決を目指す。リバタリアニズムの最も尖鋭化した形態であり、マレー・ロスバードらが中心となって論理展開を行った。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/無政府資本主義' }]
            },
            {
                id: 'conservatism', name: '自由主義的保守', x: 68, y: 40,

                desc: '自由主義的な市場経済の利点を活かしつつも、伝統的な家族観や道徳倫理、歴史的慣習といった社会秩序の継続性を尊重する思想。急進的かつ全般的な社会改変を回避し、漸進的で試行錯誤的な変化を好む傾向がある。個人の自由や私的所有権を評価しながらも、過度な個人主義による秩序崩壊を警戒し、コミュニティの団結と法と秩序を重視する。エドマンド・バークの保守思想を系譜に持つ。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/自由主義的保守' }]
            },
            {
                id: 'tconservatism', name: '伝統的保守', x: 68, y: 65,
                labelOffset: { x: 20, y: -20 },
                desc: '歴史の中で培われてきた慣習、文化、道徳秩序、社会の有機的つながりを重んじる政治思想・哲学。急激な変革や人間の理性万能主義に対する警戒を基盤とする。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/伝統保守主義' }]
            },
            {
                id: 'accelerationism', name: '加速主義', x: 15, y: 12,
                labelOffset: { x: 20, y: -20 },
                desc: '資本主義やテクノロジーの発展をあえて極限まで加速させることで、現行のシステムを内側から崩壊させ、根本的な社会変革や脱却を目指す思想',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/加速主義' }]
            },
            {
                id: 'neoconservatism', name: 'ネオコン（新保守主義）', x: 82, y: 48,
                labelOffset: { x: 20, y: -20 },
                desc: '自由民主主義や人権などの価値規範を普遍的価値と位置づけ、これを国際秩序の確立に向けて積極的に広めるため、強力な軍事力行使やタカ派外交姿勢を辞さないアメリカの政治思想潮流。軍備の増強や単独行動主義を恐れず、明確な正義観に基づき国際社会へ介入する。アーヴィング・クリストルらに始まり、ジョージ・W・ブッシュ政権下の外交政策において中心的な影響を及ぼした。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/新保守主義' }]
            },
            {
                id: 'liberalism', name: 'リベラル（自由主義）', x: 45, y: 55,
                labelOffset: { x: -160, y: -30 },
                desc: '個人の尊厳、基本的人権、自由な意思表明や思想の多様性を重視すると同時に、市場のふじょうどうや過度な格差に対して政府による一定の調整を許容する思想。言論や表現の自由、少数者の権利保護を重んじ、格差の是正や教育・セーフティネット整備における政府の積極的役割を肯定する。平和主義や国際協調を尊重し、現代ではジョン・ロールズの正義論（機会の公平と弱者保護）を思想的基盤とする。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/自由主義' }]
            },
{
                id: 'techno', name: 'テクノクラシー', x: 45, y: 75,
                labelOffset: { x: -160, y: -10 },
                desc: '科学技術や経済運営、社会政策などの高度な技術的専門知識によって、政策立案に参画し、最終的に政治経済を支配し管理することを目指す。専門的な力に基づいて権力者を選ぶという面で能力主義的側面があるが、エリート主義の1種という側面もある。一般に科学主義を重視するため、それが行き過ぎると国民の利益を軽視し最終的に国家が破綻する可能性を指摘する者もいる、が主には国民や国家へ貢献する科学技術をもとに行動する。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/テクノクラート' }]
            },
            {
                id: 'social-liberalism', name: '社会自由主義', x: 38, y: 42,
                labelOffset: { x: -180, y: -20 },
                desc: '古典的な自由主義が掲げる法的・形式的自由に留まらず、貧困や病気、教育の不平等といった実質的な不自由を克服するために福祉国家の形成を目指す思想。市場原理を認めつつも、公的介入を通じて格差を緩和し、すべての市民に公正な機会を保障する混合経済体制を支持する。19世紀末から20世紀初頭にかけてトーマス・ヒル・グリーンらによって提唱された。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/社会自由主義' }]
            },
            {
                id: 'centrism', name: '中道主義・第三の道', x: 50, y: 50,
                labelOffset: { x: 20, y: -20 },
                desc: '従来の左右対立や極端な市場原理主義と過剰な福祉国家論の双方を乗り越え、実用主義的な姿勢で双方の利点を調和させようとする立場。経済的活力の追求と社会的公正・格差是正のバランスを模索し、権利だけでなく個人の社会的責任も強調する。イデオロギー的教条主義を避け、柔軟な政策形成を目指す。アンソニー・ギデンズの「第三の道」論が知られ、トニー・ブレアなどの政権運営に大きな影響を与えた。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/第三の道' }]
            },
            {
                id: 'christian-democracy', name: 'キリスト教民主主義', x: 60, y: 58,
                labelOffset: { x: 20, y: -20 },
                desc: 'キリスト教倫理に基づく人間の尊厳と社会的連帯の理念を基調とし、保守的な家族観と社会市場経済を融合させるヨーロッパの政治思想。個人や身近なコミュニティで解決できる問題には国家が過剰介入しないとする「補助性原理」を提唱し、社会保障と資本主義の健全な調和を図る。戦後のヨーロッパ復興や欧州統合の推進において中心的役割を果たした。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/キリスト教民主主義' }]
            },
            {
                id: 'communitarianism', name: '共同体主義（コミュニタリアニズム）', x: 55, y: 70,
                labelOffset: { x: 20, y: -20 },
                desc: '個人の権利を絶対化する原子論的なリベラリズムを批判し、人間は地域社会や歴史的・文化的共同体の中でのみ自己のアイデンティティを形成できると捉える思想。孤立した個人の自由よりもコミュニティへの参加や社会的絆、責任や規範の再評価を主張する。「共通の善」の実現と市民的道徳の回復を目指す立場であり、マイケル・サンデルやチャールズ・テイラーらが主要な議論を展開している。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/共同体主義' }]
            },
            {
                id: 'green-politics', name: '緑の政治(環境主義)', x: 28, y: 35,
                labelOffset: { x: -240, y: -20 },
                desc: '地球環境の保全と持続可能性を最優先課題に掲げ、草の根民主主義、非暴力・平和主義、社会的公正を重視する思想。過度な経済成長至上主義を批判し、脱炭素社会の形成や環境負荷の少ない社会構造への転換を要求する。意思決定の分散化やジェンダー平等、多様性の尊重を推進する。1970年代の環境・平和運動から派生し、各国の環境政党の理念を形成している。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/緑の政治' }]
            },
            {
                id: 'keynesianism', name: 'ケインズ主義・福祉資本主義', x: 35, y: 65,
                labelOffset: { x: -280, y: -20 },
                desc: '市場機構だけに依存すると不況や失業（市場の失敗）が発生するため、政府が財政支出や金融調節を通じて有効需要を創出し、景気変動を緩和すべきだとする経済思想。公共投資や租税調整、社会保障制度を通じて所得再分配を行い、完全雇用と市民生活の安定を図る。ジョン・メイナード・ケインズが大恐慌期に提示し、第二次世界大戦後の高度経済成長期における各国の主要政策基盤となった。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/ケインズ経済学' }]
            },
            {
                id: 'nationalism', name: '民族主義（ナショナリズム）', x: 82, y: 68,
                labelOffset: { x: 20, y: -20 },
                desc: '共通の言語、歴史、文化、あるいは国民的アイデンティティを共有する集団の一体性と独立・発展を最優先の価値とみなす思想。主権国家の自主性と国益の保護を訴え、対外的な干渉に対する抵抗や自国文化の称揚を行う。自国の産業や労働者を優先する保護主義政策や国境管理の徹底を好む傾向を示す。近代国民国家の形成過程で不可欠な役割を果たしてきた。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/ナショナリズム' }]
            },
            {
                id: 'social-democracy', name: '社会民主主義', x: 28, y: 80,
                labelOffset: { x: -90, y: -20 },
                desc: '暴力的な革命を拒否し、立憲民主主義と議会手続きを通じて、資本主義制度の範囲内で福祉の充実や労働権の保護による公正な不平等緩和を目指す立場。国民全員を対象とする包括的な社会保障制度や累進課税政策を導入し、自由と平等の両立を図る。エドゥアルト・ベルンシュタインらの修正主義を原点とし、北欧諸国の高福祉・高負担モデルの構築に大きく寄与した。',
                links: [{ title: 'Wikipediaを読む', url: 'https://ja.wikipedia.org/wiki/社会民主主義' }]
            },
            {

            label.style.left = `calc(${item.x}% + ${item.labelOffset.x}px)`;
            label.style.top = `calc(${item.y}% + ${item.labelOffset.y}px)`;

        const container = document.getElementById('map-container');
        let scale = 1;
        let posX = 0, posY = 0;
        const initMapScale = () => {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            scale = Math.min(screenW / 1200, screenH / 1200); 
            posX = (screenW - 1000 * scale) / 2;
            posY = (screenH - 1000 * scale) / 2;
            applyTransform();
        };
        window.addEventListener('resize', initMapScale);
        function applyTransform() {
            mapEl.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }
        function zoomAtCenter(factor) {
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            posX = screenCenterX - (screenCenterX - posX) * factor;
            posY = screenCenterY - (screenCenterY - posY) * factor;
            scale *= factor;
            applyTransform();
        }
        function zoomIn() { zoomAtCenter(1.3); }
        function zoomOut() { zoomAtCenter(1 / 1.3); }
        let isDragging = false;
        let startX, startY, initialPosX, initialPosY;
        let initialPinchDistance = null;
        let initialScale = 1;
        container.addEventListener('mousedown', dragStart);
        container.addEventListener('touchstart', dragStart, {passive: false});
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, {passive: false});
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);
        function dragStart(e) {
            if (e.target.closest('.point') || e.target.closest('.point-label') || e.target.closest('#zoom-controls') || e.target.closest('#modal')) return;
            if (e.type === 'touchstart') {
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    initialScale = scale;
                    return;
                }
                startX = e.touches[0].pageX;
                startY = e.touches[0].pageY;
            } else {
                startX = e.pageX;
                startY = e.pageY;
            }
            isDragging = true;
            initialPosX = posX;
            initialPosY = posY;
        }
        function dragMove(e) {
            if (e.target.closest('#modal') || e.target.closest('#zoom-controls')) return;
            if (e.type === 'touchmove') e.preventDefault(); 
            if (e.type === 'touchmove' && e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const factor = (initialScale * (currentDistance / initialPinchDistance)) / scale;
                zoomAtCenter(factor);
                return;
            }
            if (!isDragging) return;
            let currentX = e.type === 'touchmove' ? e.touches[0].pageX : e.pageX;
            let currentY = e.type === 'touchmove' ? e.touches[0].pageY : e.pageY;
            posX = initialPosX + (currentX - startX);
            posY = initialPosY + (currentY - startY);
            applyTransform();
        }
        function dragEnd() {
            isDragging = false;
            initialPinchDistance = null;
        }
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('modal-overlay');
        function openModal(data) {
            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-desc').innerText = data.desc;
            const linksContainer = document.getElementById('modal-links');
            linksContainer.innerHTML = '';
            if (data.links && data.links.length > 0) {
                data.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = 'link-btn';
                    a.innerText = link.title;
                    linksContainer.appendChild(a);
                });
            }
            modal.classList.add('active');
            overlay.classList.add('active');
        }
        function closeModal() {
            modal.classList.remove('active');
            overlay.classList.remove('active');
        }
        overlay.addEventListener('click', closeModal);
        initMapScale();
    </script>
</body>
</html>
